name: Build CloudSwiftApp

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - macos

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ inputs.platform || 'all' }})
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS (Device - Unsigned)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
        run: |
          xcodebuild \
            -project CloudSwiftApp.xcodeproj \
            -scheme CloudSwiftApp-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_ios \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package unsigned IPA
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
        run: |
          mkdir -p Payload
          cp -R build_ios/Build/Products/Release-iphoneos/CloudSwiftApp-iOS.app Payload/
          zip -r CloudSwiftApp-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Build iOS (Simulator)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
        run: |
          xcodebuild \
            -project CloudSwiftApp.xcodeproj \
            -scheme CloudSwiftApp-iOS \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build_sim \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package iOS Simulator app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
        run: |
          cd build_sim/Build/Products/Release-iphonesimulator
          zip -r "${GITHUB_WORKSPACE}/CloudSwiftApp-iOS-Simulator.zip" CloudSwiftApp-iOS.app

      - name: Build macOS
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
        run: |
          xcodebuild \
            -project CloudSwiftApp.xcodeproj \
            -scheme CloudSwiftApp-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build_macos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package macOS DMG
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
        run: |
          hdiutil create \
            -volname "CloudSwiftApp" \
            -srcfolder build_macos/Build/Products/Release/CloudSwiftApp-macOS.app \
            -ov \
            -format UDZO \
            CloudSwiftApp-macOS.dmg

      - name: Upload iOS artifacts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
        uses: actions/upload-artifact@v4
        with:
          name: CloudSwiftApp-iOS
          path: |
            CloudSwiftApp-iOS-unsigned.ipa
            CloudSwiftApp-iOS-Simulator.zip

      - name: Upload macOS artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
        uses: actions/upload-artifact@v4
        with:
          name: CloudSwiftApp-macOS
          path: CloudSwiftApp-macOS.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CloudSwiftApp-iOS-unsigned.ipa
            CloudSwiftApp-iOS-Simulator.zip
            CloudSwiftApp-macOS.dmg
