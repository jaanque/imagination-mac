name: SampleCloudApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  SampleCloudApp:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: SampleCloudApp
        PRODUCT_BUNDLE_IDENTIFIER: com.example.samplecloudapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
